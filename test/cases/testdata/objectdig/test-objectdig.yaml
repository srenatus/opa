cases:
  - note: objectdig/empty_path
    query: data.test.p = x
    modules:
      - |
        package test
        
        p = x {
          x := object.dig({"a": 1}, [], 2)
        }
    want_result: [{x: 2}]

  - note: objectdig/path_with_single_element
    query: data.test.p = x
    modules:
      - |
        package test
        
        p = x {
          x := object.dig({ "a": 1 }, ["a"], 2)
        }
    want_result: [{x: 1}]

  - note: objectdig/path_with_two_elements
    query: data.test.p = x
    modules:
      - |
        package test
        
        p = x {
          x := object.dig({ "a": { "b": 1 } }, ["a", "b"], 2)
        }
    want_result: [{x: 1}]

  - note: objectdig/path_with_three_elements
    query: data.test.p = x
    modules:
      - |
        package test
        
        p = x {
          x := object.dig({ "a": { "b": { "c": 1 } } }, ["a", "b", "c"], 2)
        }
    want_result: [{x: 1}]

  - note: objectdig/path_with_single_element_no_result
    query: data.test.p = x
    modules:
      - |
        package test
        
        p = x {
          x := object.dig({ "a": 1 }, ["b"], 2)
        }
    want_result: [{x: 2}]

  - note: objectdig/path_with_two_elements_no_result
    query: data.test.p = x
    modules:
      - |
        package test
        
        p = x {
          x := object.dig({ "a": { "b": 1 } }, ["b", "a"], 2)
        }
    want_result: [{x: 2}]

  - note: objectdig/path_with_three_elements_no_result
    query: data.test.p = x
    modules:
      - |
        package test
        
        p = x {
          x := object.dig({ "a": { "b": { "c": 1 } } }, ["a", "b", "a"], 2)
        }
    want_result: [{x: 2}]

  - note: objectdig/path_with_non_string_keys
    query: data.test.p = x
    modules:
      - |
        package test
        
        p = x {
          x := object.dig({ 1: { "b": { [1,2,3]: 1 } } }, [1, "b", [1,2,3]], 2)
        }
    want_result: [{x: 1}]

  - note: objectdig/dig_intermediate_non_object
    query: data.test.p = x
    modules:
      - |
        package test
        
        p = x {
          x := object.dig({ "a": { "b": [1,2,3] } }, ["a", "b", "a"], 2)
        }
    want_result: [{x: 2}]

  - note: objectdig/dig_for_non_object
    query: data.test.p = x
    input_term: '{"obj":"object"}'
    modules:
      - |
        package test
        
        p = x {
          x := object.dig(input.obj, ["a"], 2)
        }
    want_error: 'object.dig: operand 1 must be object but got string'
    want_error_code: eval_type_error
    strict_error: true

  - note: objectdig/non_array_path
    query: data.test.p = x
    input_term: '{"path":"a"}'
    modules:
      - |
        package test

        p = x {
          x := object.dig({"a":1}, input.path, 2)
        }
    want_error: 'object.dig: operand 2 must be array but got string'
    want_error_code: eval_type_error
    strict_error: true
